<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/inbox-modal.css}">
    <script th:src="@{/js/profile.js}"></script>
    <script th:src="@{/js/inbox.js}"></script>
</head>

<body>

<div id="modalWindow" class="modalWindow"  style="display: none;">
    <div id="question-form">
        <h3>New question</h3>

        <form th:action="@{/add}" method="post">
            <input type="hidden" name="userName" th:value="${user.username}" />

            <textarea id="questionInput" name="text" placeholder="Ask me a question" required></textarea>

            <div class="ask-actions">
                <button type="submit" class="btn-submit">Send</button>
                <button type="button" class="btn-cancel" onclick="toggleAskForm()">Cancel</button>
            </div>
        </form>
    </div>

</div>
<div id="inboxModalWindow" class="modalWindow-inbox" style="display: none;">
    <div id="inbox-form">
        <div class="inbox-header">
            <h2>📬 Unanswered Questions</h2>
            <button class="close-btn" onclick="closeInboxModal()">&times;</button>
        </div>

        <div class="inbox-content">
            <div id="inboxQuestionsList" class="questions-list">
                <div th:each="questionText : ${unanswered}" class="question-item">
                    <p class="question-text" th:text="${questionText}">Question text</p>

                    <button class="btn-open-answer">Answer</button>
                </div>

                <p th:if="${#lists.isEmpty(unanswered)}">No questions yet.</p>
            </div>

            <div id="answerSection" class="answer-section-wrapper" style="display: none;">
                <div class="answer-section">
                    <h3>✍️ Write an answer</h3>
                    <textarea id="answerText" class="answer-textarea" placeholder="Type your answer here..."></textarea>
                    <div class="answer-actions">
                        <button class="btn-cancel-answer" onclick="cancelAnswer()">Cancel</button>
                        <button class="btn-submit-answer" onclick="submitAnswer()">Send answer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>




<!--Here starts the main content -->

<div class="header-section">
    <div class="profile-card">
        <h1 id="user-name" th:text="${user != null ? user?.displayName
         : 'User not found'}">username</h1>
        <p id="user-bio" th:text="${user?.bio}">User's bio will be here</p>
    </div>
    <div class="main-buttons">
        <div sec:authorize="isAuthenticated()">
            <div th:if="${#authentication?.name == user?.username}">
                <button class="btn-main"onclick="openInboxModal()">Inbox</button>
                <button sec:authorize="hasRole('ROLE_USER')"  class="btn-settings">⚙</button>
            </div>
        </div>
        <div th:if="${#authentication?.name != user?.username}">
            <button class="btn-main" onclick="toggleAskForm()">You have a question?</button>
            <a  id="register-button" th:href="@{/register.html}" > Sign up </a>
        </div>
    </div>



</div>



<div class="main-content">
    <div class="posts-section">
        <div th:if="${posts == null or posts.empty}" style="text-align: center; padding: 20px;">
            <p>No questions yet...</p>
        </div>

        <div th:each="post : ${posts}" class="post-item">
            <div class="post-question" th:text="${post.question}">Question text</div>
            <div th:if="${post.response != null}">
                <div class="inner-divider"></div>
                <div class="post-answer" th:text="${post.response}">Response</div>
                <div class="creation-time" th:text="${post.createdAt}"> Time of creation</div>
            </div>
        </div>
    </div>
</div>



</body>
</html>
