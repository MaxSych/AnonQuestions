<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Log in | Future UI</title>
    <link rel="stylesheet" href="../css/main.css">

</head>
<body>

    <div class="aboutsite">
        <p> This website is an anonymous messaging service designed and developed by Maksym Sych. It is a personal project focused on exploring web technologies.</p>
    <div>

<div class="scene">
    <div class="glass-card">
        <h2 id="h2-text">Log in</h2>

        <form th:action="@{/user_login}" method="post" id="loginForm">
            <input type="text" name="username" placeholder="Username" class="input-field" required>
            <input type="password" name="password" placeholder="Password" class="input-field" required>

            <div class="button-group">
                <button type="submit" id="btn-submit" class="btn-send">Send</button>
            </div>
        </form>

        <div class="already-account">
            New here? <a href="register">Sign up</a>
        </div>
    </div>
</div>

</body>
</html>
